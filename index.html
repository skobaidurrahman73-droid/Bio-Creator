<!DOCTYPE html>
<html lang="bn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Advanced Bio Link Builder</title>
    <style>
        body { margin: 0; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; overflow: hidden; background: #111; }
        
        /* সেটিংস আইকন বাটন */
        .settings-icon { position: fixed; bottom: 20px; right: 20px; background: #007bff; color: white; border: none; border-radius: 50%; width: 60px; height: 60px; font-size: 26px; cursor: pointer; z-index: 1000; box-shadow: 0 4px 15px rgba(0,0,0,0.5); transition: 0.3s; display: flex; justify-content: center; align-items: center; }
        .settings-icon:hover { transform: scale(1.1); background: #0056b3; }

        /* লুকানো টুলবার (স্লাইড হবে) */
        .toolbar { position: fixed; top: 0; right: -400px; width: 350px; height: 100vh; background: #f4f6f9; padding: 25px 20px; box-sizing: border-box; overflow-y: auto; z-index: 999; transition: right 0.4s cubic-bezier(0.4, 0, 0.2, 1); box-shadow: -5px 0 25px rgba(0,0,0,0.3); border-left: 1px solid #ddd; }
        .toolbar.open { right: 0; }
        .toolbar h3 { margin-top: 0; border-bottom: 2px solid #ccc; padding-bottom: 10px; color: #333; font-size: 18px; }
        .toolbar label { font-size: 13px; font-weight: bold; margin-top: 15px; display: block; color: #555; }
        input, select, textarea { width: 100%; margin: 5px 0; padding: 10px; border: 1px solid #ccc; border-radius: 6px; box-sizing: border-box; font-family: inherit; transition: 0.3s; }
        input:focus, select:focus, textarea:focus { border-color: #007bff; outline: none; }
        
        .add-btn { background: #28a745; color: white; font-weight: bold; font-size: 16px; margin-top: 20px; cursor: pointer; padding: 12px; border: none; border-radius: 6px; width: 100%; transition: 0.3s; }
        .add-btn:hover { background: #218838; }
        
        .row { display: flex; gap: 10px; }
        .col { flex: 1; }

        /* প্রিভিউ এরিয়া */
        .preview-container { width: 100%; height: 100vh; position: relative; display: flex; justify-content: center; align-items: center; }
        .bg-blur { position: absolute; width: 100%; height: 100%; background-size: cover; background-position: center; filter: blur(8px); z-index: 0; }
        .bg-overlay { position: absolute; width: 100%; height: 100%; background: rgba(0,0,0,0.4); z-index: 1; } /* ছবির উপরে কালো শ্যাডো */
        
        .preview-content { position: relative; z-index: 2; width: 100%; max-width: 420px; text-align: center; padding: 40px 20px; color: white; height: 90vh; overflow-y: auto; border-radius: 20px; }
        
        /* প্রোফাইল ও টেক্সট */
        .profile-pic { width: 140px; height: 140px; border-radius: 50%; object-fit: cover; border: 4px solid white; display: none; margin: 0 auto 15px; box-shadow: 0 4px 15px rgba(0,0,0,0.5); }
        #displayName { margin: 10px 0 5px; font-weight: bold; font-size: 32px; letter-spacing: 1px; text-shadow: 0 2px 4px rgba(0,0,0,0.5); }
        #displayBio { opacity: 0.9; margin-bottom: 30px; font-size: 16px; white-space: pre-wrap; line-height: 1.5; text-shadow: 0 1px 3px rgba(0,0,0,0.5); }
        
        /* কাস্টম বাটন */
        .link-btn { display: flex; justify-content: center; align-items: center; width: 100%; padding: 16px; margin-bottom: 15px; text-decoration: none; border-radius: 30px; font-weight: 600; font-size: 16px; transition: all 0.3s ease; box-sizing: border-box; position: relative; overflow: hidden; }
        .link-btn:hover { transform: translateY(-3px); filter: brightness(1.1); }
    </style>
</head>
<body>

    <button class="settings-icon" onclick="toggleToolbar()">⚙️</button>

    <div class="toolbar" id="toolbar">
        <h3>⚙️ প্রোফাইল ও ব্যাকগ্রাউন্ড ডিজাইন</h3>
        
        <label>প্রোফাইল ছবি আপলোড:</label>
        <input type="file" accept="image/*" onchange="loadImg(event, 'profileImg')">
        
        <div class="row">
            <div class="col"><label>ছবির বর্ডার কালার:</label><input type="color" value="#ffffff" onchange="updateStyle('profileImg', 'borderColor', this.value)"></div>
            <div class="col"><label>বর্ডার সাইজ (px):</label><input type="number" value="4" onchange="updateStyle('profileImg', 'borderWidth', this.value + 'px')"></div>
        </div>

        <label>ব্যাকগ্রাউন্ড ছবি আপলোড:</label>
        <input type="file" accept="image/*" onchange="loadBg(event)">
        
        <div class="row">
            <div class="col">
                <label>ব্যাকগ্রাউন্ড ব্লার:</label>
                <input type="range" min="0" max="30" value="8" onchange="updateStyle('bgArea', 'filter', `blur(${this.value}px)`)">
            </div>
            <div class="col">
                <label>অন্ধকার ওভারলে:</label>
                <input type="range" min="0" max="9" value="4" onchange="updateStyle('bgOverlay', 'background', `rgba(0,0,0,0.${this.value})`)">
            </div>
        </div>

        <label>আপনার নাম:</label>
        <input type="text" onkeyup="updateText('displayName', this.value)" placeholder="নাম লিখুন">
        <div class="row">
            <div class="col"><label>নামের কালার:</label><input type="color" value="#ffffff" onchange="updateStyle('displayName', 'color', this.value)"></div>
            <div class="col"><label>ফন্ট সাইজ (px):</label><input type="number" value="32" onchange="updateStyle('displayName', 'fontSize', this.value + 'px')"></div>
        </div>

        <label>বায়ো (Bio):</label>
        <textarea rows="3" onkeyup="updateText('displayBio', this.value)" placeholder="আপনার সম্পর্কে বিস্তারিত লিখুন..."></textarea>
        <label>বায়ো টেক্সট কালার:</label>
        <input type="color" value="#e0e0e0" onchange="updateStyle('displayBio', 'color', this.value)">

        <hr style="margin: 25px 0; border: 0; border-top: 1px solid #ccc;">

        <h3>🔘 বাটন কাস্টমাইজেশন</h3>
        
        <label>বাটনের নাম (টেক্সট):</label>
        <input type="text" id="btnName" placeholder="যেমন: Facebook / YouTube">
        
        <label>বাটনের লিংক (URL):</label>
        <input type="url" id="btnLink" placeholder="https://...">
        
        <div class="row">
            <div class="col"><label>ব্যাকগ্রাউন্ড কালার:</label><input type="color" id="btnBg" value="#ffffff"></div>
            <div class="col"><label>টেক্সট কালার:</label><input type="color" id="btnColor" value="#000000"></div>
        </div>
        
        <div class="row">
            <div class="col"><label>বর্ডার কালার:</label><input type="color" id="btnBorder" value="#ffffff"></div>
            <div class="col"><label>বর্ডার সাইজ (px):</label><input type="number" id="btnBorderWidth" value="0" min="0"></div>
        </div>

        <div class="row">
            <div class="col">
                <label>বাটনের আকার:</label>
                <select id="btnStyle">
                    <option value="30px">সম্পূর্ণ গোল</option>
                    <option value="12px">হালকা বাঁকানো</option>
                    <option value="0px">চারকোনা</option>
                </select>
            </div>
            <div class="col">
                <label>বাটনের শ্যাডো:</label>
                <select id="btnShadow">
                    <option value="0 5px 15px rgba(0,0,0,0.3)">হ্যাঁ</option>
                    <option value="none">না</option>
                </select>
            </div>
        </div>

        <button class="add-btn" onclick="createBtn()">+ বাটন যোগ করুন</button>
    </div>

    <div class="preview-container">
        <div class="bg-blur" id="bgArea"></div>
        <div class="bg-overlay" id="bgOverlay"></div>
        
        <div class="preview-content" id="previewArea">
            <img id="profileImg" class="profile-pic" src="">
            <h1 id="displayName">আপনার নাম</h1>
            <p id="displayBio">এখানে আপনার বিস্তারিত বায়ো দেখাবে...</p>
            <div id="buttonArea"></div>
        </div>
    </div>

    <script>
        // টুলবার হাইড/শো করা
        function toggleToolbar() {
            document.getElementById('toolbar').classList.toggle('open');
        }

        // ছবি লোড করা
        function loadImg(event, id) {
            let img = document.getElementById(id);
            img.src = URL.createObjectURL(event.target.files[0]);
            img.style.display = 'block';
        }

        function loadBg(event) {
            document.getElementById('bgArea').style.backgroundImage = `url(${URL.createObjectURL(event.target.files[0])})`;
        }

        // টেক্সট এবং স্টাইল আপডেট করা
        function updateText(id, text) {
            document.getElementById(id).innerText = text;
        }

        function updateStyle(id, property, value) {
            document.getElementById(id).style[property] = value;
        }

        // নতুন বাটন তৈরি করা
        function createBtn() {
            let name = document.getElementById('btnName').value;
            let link = document.getElementById('btnLink').value;
            
            if(name && link) {
                let btn = document.createElement('a');
                btn.href = link; 
                btn.innerText = name; 
                btn.className = 'link-btn'; 
                btn.target = '_blank';
                
                // বাটনের সকল ডিজাইন সেট করা
                btn.style.backgroundColor = document.getElementById('btnBg').value;
                btn.style.color = document.getElementById('btnColor').value;
                btn.style.borderRadius = document.getElementById('btnStyle').value;
                btn.style.border = `${document.getElementById('btnBorderWidth').value}px solid ${document.getElementById('btnBorder').value}`;
                btn.style.boxShadow = document.getElementById('btnShadow').value;

                document.getElementById('buttonArea').appendChild(btn);
                
                // ইনপুট বক্স খালি করা
                document.getElementById('btnName').value = '';
                document.getElementById('btnLink').value = '';
            } else {
                alert('দয়া করে বাটনের নাম এবং লিংক পূরণ করুন!');
            }
        }
    </script>
</body>
</html>
