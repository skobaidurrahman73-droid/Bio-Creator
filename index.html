<!DOCTYPE html>
<html lang="bn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bio Link</title>
    <style>
        body { margin: 0; font-family: sans-serif; background: #111; overflow-x: hidden; }
        .settings-icon { position: fixed; bottom: 20px; right: 20px; background: #007bff; color: white; border: none; border-radius: 50%; width: 60px; height: 60px; font-size: 26px; cursor: pointer; z-index: 1000; display: flex; justify-content: center; align-items: center; }
        .toolbar { position: fixed; top: 0; right: -400px; width: 350px; height: 100vh; background: #f4f6f9; padding: 25px 20px; box-sizing: border-box; overflow-y: auto; z-index: 999; transition: 0.4s; }
        .toolbar.open { right: 0; }
        .toolbar label { font-size: 13px; font-weight: bold; margin-top: 10px; display: block; color: #555; }
        input, select, textarea { width: 100%; margin: 5px 0; padding: 8px; border: 1px solid #ccc; border-radius: 6px; box-sizing: border-box; }
        .btn { background: #28a745; color: white; padding: 12px; border: none; border-radius: 6px; width: 100%; cursor: pointer; margin-top: 15px; font-weight: bold; }
        .btn-finish { background: #dc3545; font-size: 18px; }
        .row { display: flex; gap: 10px; } .col { flex: 1; }
        
        .preview-container { width: 100%; min-height: 100vh; position: relative; display: flex; justify-content: center; align-items: center; }
        .bg-blur { position: absolute; width: 100%; height: 100%; background-size: cover; background-position: center; z-index: 0; }
        .bg-overlay { position: absolute; width: 100%; height: 100%; z-index: 1; }
        .preview-content { position: relative; z-index: 2; width: 100%; max-width: 420px; text-align: center; padding: 40px 20px; color: white; }
        
        .profile-pic { width: 140px; height: 140px; border-radius: 50%; object-fit: cover; display: none; margin: 0 auto 15px; }
        #displayName { margin: 10px 0 5px; font-size: 32px; font-weight: bold; }
        #displayBio { font-size: 16px; white-space: pre-wrap; margin-bottom: 20px; }
        .link-btn { display: block; width: 100%; padding: 15px; margin-bottom: 15px; text-decoration: none; border-radius: 30px; font-weight: bold; box-sizing: border-box; }
        
        #linkModal { display: none; position: fixed; top: 50%; left: 50%; transform: translate(-50%, -50%); background: white; padding: 20px; border-radius: 10px; z-index: 2000; color: black; text-align: center; width: 80%; max-width: 400px; box-shadow: 0 0 20px rgba(0,0,0,0.5); }
        #linkInput { width: 100%; padding: 10px; margin: 10px 0; }
    </style>
</head>
<body>

    <button class="settings-icon" id="settingsIcon" onclick="document.getElementById('toolbar').classList.toggle('open')">⚙️</button>

    <div class="toolbar" id="toolbar">
        <h3>ডিজাইন প্যানেল</h3>
        <label>ফন্ট স্টাইল:</label>
        <select onchange="document.getElementById('previewArea').style.fontFamily = this.value">
            <option value="sans-serif">Sans-serif</option>
            <option value="serif">Serif</option>
            <option value="monospace">Monospace</option>
        </select>

        <label>টেক্সট এলাইনমেন্ট:</label>
        <select onchange="document.getElementById('previewArea').style.textAlign = this.value">
            <option value="center">মাঝে</option>
            <option value="left">বামে</option>
            <option value="right">ডানে</option>
        </select>

        <label>প্রোফাইল ছবি:</label>
        <input type="file" accept="image/*" onchange="encodeImage(event, 'profileImg')">
        <label>ব্যাকগ্রাউন্ড ছবি:</label>
        <input type="file" accept="image/*" onchange="encodeImage(event, 'bgArea', true)">

        <label>নাম:</label>
        <input type="text" id="nameInput" onkeyup="document.getElementById('displayName').innerText = this.value" placeholder="নাম">
        <label>বায়ো:</label>
        <textarea id="bioInput" onkeyup="document.getElementById('displayBio').innerText = this.value"></textarea>

        <hr>
        <h4>বাটন যোগ করুন</h4>
        <input type="text" id="btnName" placeholder="বাটনের নাম">
        <input type="url" id="btnLink" placeholder="https://...">
        <div class="row">
            <div class="col"><label>ব্যাকগ্রাউন্ড:</label><input type="color" id="btnBg" value="#ffffff"></div>
            <div class="col"><label>টেক্সট:</label><input type="color" id="btnColor" value="#000000"></div>
        </div>
        <button class="btn" onclick="createBtn()">+ বাটন যোগ করুন</button>

        <hr>
        <button class="btn btn-finish" onclick="saveBio()">✅ বায়ু সম্পন্ন করুন</button>
    </div>

    <div class="preview-container">
        <div class="bg-blur" id="bgArea" style="filter: blur(8px);"></div>
        <div class="bg-overlay" id="bgOverlay" style="background: rgba(0,0,0,0.5);"></div>
        
        <div class="preview-content" id="previewArea">
            <img id="profileImg" class="profile-pic" src="">
            <h1 id="displayName">আপনার নাম</h1>
            <p id="displayBio">আপনার বায়ো...</p>
            <div id="buttonArea"></div>
        </div>
    </div>

    <div id="linkModal">
        <h3>আপনার বায়ুর লিংক তৈরি হয়েছে!</h3>
        <input type="text" id="linkInput" readonly>
        <button class="btn" onclick="copyLink()">লিংক কপি করুন</button>
        <button class="btn" style="background: #ccc; color: black;" onclick="document.getElementById('linkModal').style.display='none'">বন্ধ করুন</button>
    </div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/12.11.0/firebase-app.js";
        import { getDatabase, ref, set, get } from "https://www.gstatic.com/firebasejs/12.11.0/firebase-database.js";

        const firebaseConfig = {
            apiKey: "AIzaSyAMieYVdk6IYh5IYjfiXY35MuXE8Qr75SA",
            authDomain: "bio00-f464e.firebaseapp.com",
            databaseURL: "https://bio00-f464e-default-rtdb.firebaseio.com",
            projectId: "bio00-f464e",
            storageBucket: "bio00-f464e.firebasestorage.app",
            messagingSenderId: "146338187749",
            appId: "1:146338187749:web:e89348d7f3c548bea7470c"
        };

        const app = initializeApp(firebaseConfig);
        const db = getDatabase(app);

        let profileBase64 = "";
        let bgBase64 = "";
        let buttonsData = [];

        // ছবিকে Base64 এ রূপান্তর (লিংকে সেভ করার জন্য)
        window.encodeImage = function(event, id, isBg = false) {
            let file = event.target.files[0];
            let reader = new FileReader();
            reader.onloadend = function() {
                if(isBg) {
                    bgBase64 = reader.result;
                    document.getElementById(id).style.backgroundImage = `url(${reader.result})`;
                } else {
                    profileBase64 = reader.result;
                    document.getElementById(id).src = reader.result;
                    document.getElementById(id).style.display = 'block';
                }
            }
            if(file) reader.readAsDataURL(file);
        }

        window.createBtn = function() {
            let name = document.getElementById('btnName').value;
            let link = document.getElementById('btnLink').value;
            let bg = document.getElementById('btnBg').value;
            let color = document.getElementById('btnColor').value;
            
            if(name && link) {
                buttonsData.push({ name, link, bg, color });
                renderButtons();
                document.getElementById('btnName').value = '';
                document.getElementById('btnLink').value = '';
            }
        }

        function renderButtons() {
            let html = "";
            buttonsData.forEach(btn => {
                html += `<a href="${btn.link}" class="link-btn" target="_blank" style="background:${btn.bg}; color:${btn.color};">${btn.name}</a>`;
            });
            document.getElementById('buttonArea').innerHTML = html;
        }

        // ফায়ারবেসে ডাটা সেভ করা
        window.saveBio = async function() {
            let bioId = "bio_" + Math.random().toString(36).substr(2, 9);
            let data = {
                name: document.getElementById('displayName').innerText,
                bio: document.getElementById('displayBio').innerText,
                font: document.getElementById('previewArea').style.fontFamily || "sans-serif",
                align: document.getElementById('previewArea').style.textAlign || "center",
                profilePic: profileBase64,
                bgImage: bgBase64,
                buttons: buttonsData
            };

            await set(ref(db, 'bios/' + bioId), data);
            
            let shareUrl = window.location.href.split('?')[0] + "?id=" + bioId;
            document.getElementById('linkInput').value = shareUrl;
            document.getElementById('linkModal').style.display = 'block';
        }

        window.copyLink = function() {
            let copyText = document.getElementById("linkInput");
            copyText.select();
            document.execCommand("copy");
            alert("লিংক কপি হয়েছে!");
        }

        // লিংকে আইডি থাকলে ডাটা লোড করা
        window.onload = async function() {
            const urlParams = new URLSearchParams(window.location.search);
            const bioId = urlParams.get('id');
            
            if(bioId) {
                document.getElementById('settingsIcon').style.display = 'none'; // ভিউয়ার মোডে টুলবার লুকানো
                document.getElementById('toolbar').style.display = 'none';
                
                const snapshot = await get(ref(db, 'bios/' + bioId));
                if(snapshot.exists()) {
                    let data = snapshot.val();
                    document.getElementById('displayName').innerText = data.name;
                    document.getElementById('displayBio').innerText = data.bio;
                    document.getElementById('previewArea').style.fontFamily = data.font;
                    document.getElementById('previewArea').style.textAlign = data.align;
                    
                    if(data.profilePic) {
                        document.getElementById('profileImg').src = data.profilePic;
                        document.getElementById('profileImg').style.display = 'block';
                    }
                    if(data.bgImage) {
                        document.getElementById('bgArea').style.backgroundImage = `url(${data.bgImage})`;
                    }
                    if(data.buttons) {
                        buttonsData = data.buttons;
                        renderButtons();
                    }
                } else {
                    alert("বায়ু পাওয়া যায়নি!");
                }
            }
        }
    </script>
</body>
</html>
